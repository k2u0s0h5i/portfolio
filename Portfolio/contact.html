<!DOCTYPE html>

    body { text-align: center; }

    h1 {

      color: bisque;
      margin-bottom: 10px;

    }

    .contact-info a {
      color: #f5deb3;
      text-decoration: none;
    }

    form {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    input, textarea {
      width: 60%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      outline: none;

    button {
      background: bisque;
      color: #111;
      border: none;
      padding: 12px 30px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
